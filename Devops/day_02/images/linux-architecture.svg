<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Linux architecture overview</title>
  <desc id="desc">Diagram showing user space, kernel, and systemd boot flow.</desc>

  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #374151; }
      .label { font: 600 20px Arial, sans-serif; fill: #111827; }
      .small { font: 16px Arial, sans-serif; fill: #374151; }
      .box { fill: #e0f2fe; stroke: #0ea5e9; stroke-width: 3; rx: 18; }
      .kernel { fill: #dcfce7; stroke: #22c55e; stroke-width: 3; rx: 18; }
      .sysd { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 3; rx: 18; }
      .hardware { fill: #fee2e2; stroke: #ef4444; stroke-width: 3; rx: 18; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .thin { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="600" y="60" text-anchor="middle" class="title">Linux Architecture Overview</text>

  <rect class="box" x="80" y="140" width="1040" height="420" rx="26"/>

  <text x="600" y="110" text-anchor="middle" class="subtitle">User Space</text>
  <rect class="box" x="130" y="180" width="260" height="120"/>
  <text x="260" y="230" text-anchor="middle" class="label">Applications</text>
  <text x="260" y="260" text-anchor="middle" class="small">web, db, ssh, shell</text>

  <rect class="box" x="470" y="180" width="260" height="120"/>
  <text x="600" y="230" text-anchor="middle" class="label">Services</text>
  <text x="600" y="260" text-anchor="middle" class="small">nginx, docker, cron</text>

  <rect class="sysd" x="810" y="180" width="260" height="120"/>
  <text x="940" y="230" text-anchor="middle" class="label">systemd</text>
  <text x="940" y="260" text-anchor="middle" class="small">boot manager, units, targets</text>

  <rect class="kernel" x="320" y="390" width="560" height="120"/>
  <text x="600" y="440" text-anchor="middle" class="label">Kernel</text>
  <text x="600" y="470" text-anchor="middle" class="small">CPU scheduling, memory, filesystems, devices, networking, processes</text>

  <rect class="hardware" x="470" y="560" width="260" height="80"/>
  <text x="600" y="608" text-anchor="middle" class="label">Hardware</text>

  <path class="arrow" d="M 390 300 L 470 300"/>
  <path class="arrow" d="M 730 300 L 810 300"/>
  <path class="thin" d="M 600 300 L 600 390"/>
  <path class="arrow" d="M 600 510 L 600 560"/>
  <path class="thin" d="M 260 300 L 260 390 L 320 390"/>
  <path class="thin" d="M 940 300 L 940 390 L 880 390"/>

  <text x="430" y="286" class="small">requests</text>
  <text x="760" y="286" class="small">starts / manages</text>
  <text x="622" y="350" class="small">system calls</text>
  <text x="612" y="545" class="small">hardware access</text>
</svg>
